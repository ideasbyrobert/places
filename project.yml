name: GridWindowManager
options:
  bundleIdPrefix: com.ideasbyrobert
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
# Kept in step with Package.swift by hand: SwiftPM builds the release, the
# generated project builds the tests, and when only one of them knew about
# Sparkle the test target could not compile the app at all.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: X87D35HM5V
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  GridWindowManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/GridWindowManager
      - path: Resources/GridWindowManager.icon
        buildPhase: resources
    info:
      path: .derived/xcodegen/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        NSAppleEventsUsageDescription: GridWindowManager uses Terminal Automation only to set the selected tab in each Terminal window to 80 columns by 48 rows when you choose Arrange App Windows 4 × 2.
        SUFeedURL: https://downloads.ideasbyrobert.com/spread/appcast.xml
        SUPublicEDKey: +vhVXgERIDkF9jUDCo/eorsxZ8NP52N+ILOpYHZCiKQ=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    dependencies:
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Resources/GridWindowManager.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: GridWindowManager
        COMBINE_HIDPI_IMAGES: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.GridWindowManager
        PRODUCT_NAME: GridWindowManager
  WindowFixtureApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/WindowFixtureApp
    info:
      path: Resources/FixtureInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.GridWindowManager.WindowFixtureApp
        PRODUCT_NAME: WindowFixtureApp
  GridWindowManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GridWindowManagerTests
    dependencies:
      - target: GridWindowManager
      - target: WindowFixtureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSAppleEventsUsageDescription: GridWindowManager tests automate disposable Terminal windows only during the explicit live Terminal test.
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.GridWindowManagerTests
  GridWindowManagerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/GridWindowManagerUITests
    dependencies:
      - target: GridWindowManager
      - target: WindowFixtureApp
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ideasbyrobert.GridWindowManagerUITests
schemes:
  GridWindowManager:
    build:
      targets:
        GridWindowManager: all
        WindowFixtureApp: [test]
        GridWindowManagerTests: [test]
        GridWindowManagerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GridWindowManagerTests
        - GridWindowManagerUITests
    archive:
      config: Release
  WindowFixtureApp:
    build:
      targets:
        WindowFixtureApp: all
    run:
      config: Debug
